services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/Kernel.php'
            - '../src/Domain/'
            - '../src/Http/Patterns.php'
            - '../src/Http/QueryParams.php'
            - '../src/Http/RequireApiKey.php'

    Doctrine\DBAL\Connection:
        factory: ['App\Database\ConnectionFactory', 'create']
        arguments:
            $url: '%env(DATABASE_URL)%'
            $statementTimeoutMs: '%env(int:DB_STATEMENT_TIMEOUT_MS)%'
